# Release (requirements.md 4.9, REQ-REL-2 and REQ-REL-3; Q60, Q61, Q64).
# Runs only on a pushed tag or a manual dispatch, never on a branch push or a pull request.
# A `v*` tag packs, signs and publishes the npm packages; a `go/v*` tag verifies the Go module.
# The npm side is two jobs. `pack` builds, packs, signs and verifies with no environment, so a
# dispatch from any ref (main included) runs it without an approval. `publish` runs behind the
# npm-release environment and only when the ref is a `v*` tag and the event is a tag push or a
# dispatch with the `publish` input true, so a dispatch from a branch can never publish.
name: release
on:
  push:
    tags: ['v*', 'go/v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packed tarballs to npm (only honoured on a v* tag ref)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # No environment here: keyless signing only needs this job's OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: install forgeseal
        run: |
          go install github.com/sns45/forgeseal/cmd/forgeseal@v0.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # bun pm pack rewrites workspace: ranges; npm pack would ship them verbatim (Q60).
      # The root LICENSE is copied into each package so every tarball ships it.
      - name: pack every published package
        shell: bash
        run: |
          mkdir -p dist-release
          for dir in packages/*/; do
            if [ "$(jq -r '.private // false' "${dir}package.json")" = "true" ]; then continue; fi
            cp LICENSE "$dir"
            (cd "$dir" && bun pm pack --destination ../../dist-release)
          done
          ls -l dist-release
      - name: check the packed manifests and files
        run: bun scripts/release/manifest.ts dist-release/*.tgz
      # Unpacks the conformance tarball outside the checkout and loads its vectors (REQ-CONF-7).
      - name: packed conformance tarball loads every vector outside the repository
        shell: bash
        run: bun scripts/release/packed-vectors.ts dist-release/anyonce-conformance-*.tgz
      # Keyless signing through Fulcio under this job's OIDC identity; every signature is recorded in
      # Rekor (Q61). forgeseal defaults to keyed mode, so keyless is explicit. forgeseal writes the
      # sigstore-go protobuf bundle (v0.3 JSON), which cosign reads with --bundle. forgeseal v0.5.1
      # cannot parse its own keyless bundle (logIndex is a JSON string in the protobuf form), so
      # cosign verify-blob is the verifier: it checks the Fulcio chain, the Rekor entry, the signer
      # identity and the OIDC issuer.
      - name: SBOM, sign and verify every tarball
        shell: bash
        run: |
          for tgz in dist-release/*.tgz; do
            base="${tgz%.tgz}"
            unpacked="dist-release/unpacked/$(basename "$base")"
            mkdir -p "$unpacked"
            tar -xzf "$tgz" -C "$unpacked"
            bun scripts/release/lockfile.ts bun.lock "$unpacked/package"
            forgeseal sbom --dir "$unpacked/package" -o "$base.cdx.json"
            forgeseal sign --keyed=false --artifact "$tgz" --bundle "$tgz.sigstore.json"
            forgeseal sign --keyed=false --artifact "$base.cdx.json" --bundle "$base.cdx.json.sigstore.json"
            # digest check only
            cosign verify-blob --bundle "$tgz.sigstore.json" --certificate-identity-regexp '^https://github\.com/sns45/anyonce/\.github/workflows/release\.yml@' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tgz"
            cosign verify-blob --bundle "$base.cdx.json.sigstore.json" --certificate-identity-regexp '^https://github\.com/sns45/anyonce/\.github/workflows/release\.yml@' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$base.cdx.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs-sboms-signatures
          path: |
            dist-release/*.tgz
            dist-release/*.cdx.json
            dist-release/*.sigstore.json
          if-no-files-found: error

  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    # The owner must configure required reviewers on the npm-release environment in the repository
    # settings (Settings, Environments, npm-release); without them the environment gates nothing.
    # DOPPLER_TOKEN is an environment secret on npm-release, so only this job can read it.
    environment: npm-release
    # npm publish --provenance needs this job's OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history, so the gate below can check that the tagged commit is on main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      # The tarballs, SBOMs and bundles that pack signed and verified; nothing is rebuilt here.
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs-sboms-signatures
          path: dist-release
      - name: packed versions equal the tag
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for tgz in dist-release/*.tgz; do
            actual="$(tar -xzOf "$tgz" package/package.json | jq -r .version)"
            if [ "$actual" != "$expected" ]; then
              echo "$tgz is version $actual, the tag $GITHUB_REF_NAME expects $expected"
              exit 1
            fi
          done
      # A v tag on a commit that never reached main (a side branch, a stray commit) must not publish.
      - name: tagged commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on origin/main; refusing to publish"
            exit 1
          fi
      # NPM_TOKEN comes from Doppler (project release-tooling, config prd), sourced through the
      # DOPPLER_TOKEN environment secret on the npm-release environment; it never lands in a
      # GitHub secret, an .npmrc on disk outside doppler run, or a log line.
      - name: verify npm authentication resolves through Doppler
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          cat > /tmp/verify-npm-auth.sh <<'SCRIPT'
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN could not be resolved from Doppler. Verify the DOPPLER_TOKEN secret is set on the npm-release environment and the release-tooling/prd config contains NPM_TOKEN."
            exit 1
          fi
          export NODE_AUTH_TOKEN="$NPM_TOKEN"
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::npm authentication failed. NPM_TOKEN (from Doppler release-tooling/prd via DOPPLER_TOKEN) is missing, expired, or lacks publish rights to the @anyonce scope."
            exit 1
          fi
          echo "Authenticated to npm as: $(npm whoami)"
          SCRIPT
          doppler run -- bash /tmp/verify-npm-auth.sh
      # @anyonce/core goes first, since every other package peers on it. A tarball whose name@version
      # is already on npm is skipped, so a run that failed part way can be rerun.
      - name: publish with provenance
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          cat > /tmp/publish-packages.sh <<'SCRIPT'
          set -euo pipefail
          export NODE_AUTH_TOKEN="$NPM_TOKEN"
          publish_one() {
            local tgz="$1" name version
            name="$(tar -xzOf "$tgz" package/package.json | jq -r .name)"
            version="$(tar -xzOf "$tgz" package/package.json | jq -r .version)"
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already published, skipping"
              return 0
            fi
            # A bare dir/file.tgz path reads as a GitHub user/repo shorthand to npm; ./ makes it a file.
            npm publish "./$tgz" --provenance --access public
          }
          for tgz in dist-release/anyonce-core-*.tgz; do
            publish_one "$tgz"
          done
          for tgz in dist-release/*.tgz; do
            case "$tgz" in dist-release/anyonce-core-*) continue ;; esac
            publish_one "$tgz"
          done
          SCRIPT
          doppler run -- bash /tmp/publish-packages.sh

  go:
    if: startsWith(github.ref, 'refs/tags/go/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: go
          version: v2.13.2
