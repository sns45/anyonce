name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: bun install --frozen-lockfile
      - run: bun run doctor
        env:
          DOCTOR_SKIP_GOLANGCI: '1'
      - run: bun run lint
      - name: dash gate
        shell: bash
        run: |
          ! rg -n "[\x{2013}\x{2014}]" --glob '!docs/reference/**' --glob '!node_modules' --glob '!*.lock' .
      - name: key-log gate
        shell: bash
        run: |
          ! rg -n 'console\.(log|info|warn|error)\(.*key' packages go
      - run: bun run build
      - run: bun run typecheck
      - run: bun run size
      - shell: bash
        run: bun run test 2>&1 | tee test.log
      - run: scripts/no-skips.sh test.log
      - run: bun run test:coverage
      - run: bun run test:reqs

  vectors-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run vectors:validate

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - shell: bash
        run: bun run test:workers 2>&1 | tee workers.log
      - run: scripts/no-skips.sh workers.log

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    strategy:
      matrix:
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - name: cgo free build
        run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: anyhook interop (nested test only module)
        working-directory: go/webhookmw/interop
        run: go test -race ./...
      - run: ../scripts/go-engine-coverage.sh
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: go
          version: v2.13.2

  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: docker compose -f test/compose.yml up -d --wait
      - run: bun run services:check
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: go store tests against the services
        working-directory: go
        env:
          ANYONCE_REQUIRE_SERVICES: '1'
        run: go test -race -count=1 ./store/... ./anyqmw/...
      - shell: bash
        run: bun run test:services 2>&1 | tee services.log
      - run: scripts/no-skips.sh services.log
      - name: third-party conformance containers
        run: docker compose -f conformance/third-party/compose.yml up -d --wait --build
      - name: regenerate and diff the cross-implementation report
        run: bun run report
      - if: always()
        run: docker compose -f conformance/third-party/compose.yml down -v
      - if: always()
        run: docker compose -f test/compose.yml down -v

  node-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node --input-type=module -e "const m = await import('./packages/conformance/dist/index.js'); if (typeof m.runVectors !== 'function') process.exit(1);"
      - run: node -e "const m = require('./packages/conformance/dist/index.cjs'); if (typeof m.runVectors !== 'function') process.exit(1);"
      - run: node -e "require('@anyonce/core'); require('@anyonce/core/testing'); require('@anyonce/core/http'); require('@anyonce/hono'); require('@anyonce/conformance/runtime'); require('@anyonce/webhooks');"
      - run: bun run test:node

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:deno

  # REQ-DOC-7: every example's smoke test. Only the two compose services the examples use are started.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: docker compose -f test/compose.yml up -d --wait dynamodb postgres
      - shell: bash
        run: bun run test:examples 2>&1 | tee examples.log
      - run: scripts/no-skips.sh examples.log
      - shell: bash
        run: bun run test:examples:workers 2>&1 | tee examples-workers.log
      - run: scripts/no-skips.sh examples-workers.log
      - name: go-net-http-postgres
        working-directory: examples/go-net-http-postgres
        env:
          ANYONCE_REQUIRE_SERVICES: '1'
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: go-net-http-postgres lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: examples/go-net-http-postgres
          version: v2.13.2
      - if: always()
        run: docker compose -f test/compose.yml down -v
